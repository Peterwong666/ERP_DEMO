services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:${ERP_API_PORT:-8000}:8000"
    environment:
      # JSON list; env var replaces cors_origins, so include all dev origins
      ERP_CORS_ORIGINS: >-
        ["http://localhost:5173","http://127.0.0.1:5173","http://localhost:8080","http://127.0.0.1:8080"]
      # 数据库放在独立挂载卷，容器重建后数据保留
      ERP_DATABASE_URL: sqlite:////data/erp_demo.db
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
    volumes:
      - erp-data:/data

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:${ERP_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  erp-data:
