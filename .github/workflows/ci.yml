name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check apps/
      - run: uv run pytest --cov=apps/api/app
      - name: Seed demo data (idempotent)
        run: cd apps/api && uv run python -m app.seeds.ensure_seed
      - name: Hard-gate metric checks (8 metrics)
        run: make check

  web:
    # Playwright 1.59 supports Ubuntu 24.04 for Chromium.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm lint
      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: apps/web
        run: pnpm test
      - working-directory: apps/web
        run: pnpm build

  docker-first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start a freshly seeded demo
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify the browser origin and seeded business data
        run: |
          curl -fsS http://localhost:8080/ >/dev/null
          curl -fsS http://localhost:8080/api/dashboard |
            jq -e '.open_po_count == 4 and .available_sku_count == 50 and .suggestion_count == 8'
          curl -fsS http://localhost:8080/api/inventory/reconciliation |
            jq -e '. == []'
      - name: Show startup diagnostics
        if: failure()
        run: docker compose logs --tail 60
      - name: Stop demo
        if: always()
        run: docker compose down
